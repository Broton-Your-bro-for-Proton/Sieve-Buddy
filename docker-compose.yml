# Sieve-Dienst (REST + MCP). Anbieter und Zugangsdaten in .env – siehe .env.example und README.
services:
  sieve:
    build: .
    image: sieve-service:latest
    container_name: sieve
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sieve-data:/data

volumes:
  sieve-data:
