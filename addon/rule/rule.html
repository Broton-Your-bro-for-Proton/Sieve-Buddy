<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sieve rule from mail</title>
  <link rel="stylesheet" href="../manager/manager.css">
  <link rel="stylesheet" href="rule.css">
  <script src="../vendor/bcrypt.min.js"></script>
  <script type="module" src="../shared/localize.js"></script>
  <script type="module" src="rule.js"></script>
</head>
<body class="rule-page">
  <header class="topbar">
    <h1>Sieve rule from mail</h1>
    <span id="account" class="account"></span>
  </header>

  <main id="loading" class="card"><p class="muted">Loading mail and filters …</p></main>

  <main id="need-login" class="card narrow" hidden>
    <h2>Not connected to Proton</h2>
    <p class="muted">Sign in to Sieve Buddy first.</p>
    <div class="row"><button type="button" id="open-manager">Open manager</button></div>
  </main>

  <main id="form" class="rule-form" hidden>
    <div class="rule-main">
    <section class="mail-summary">
      <div class="subject" id="mail-subject"></div>
      <div class="muted" id="mail-from"></div>
      <div class="current" id="current"></div>
    </section>

    <section>
      <h2>If …</h2>
      <div id="conditions" class="conditions"></div>
      <div class="row tight">
        <label class="inline" id="combine-row" hidden>Combine
          <select id="combine">
            <option value="anyof">any of them matches (OR)</option>
            <option value="allof">all of them match (AND)</option>
          </select>
        </label>
      </div>
    </section>

    <section>
      <h2>… then</h2>
      <div class="actions-grid">
        <label class="inline">Move to
          <span class="suggest">
            <input id="folder" placeholder="(don't move)" autocomplete="off" aria-controls="folder-list">
            <span id="folder-list" role="listbox" hidden></span>
          </span>
        </label>
        <label class="switch"><input type="checkbox" id="seen"> mark as read</label>
        <label class="switch"><input type="checkbox" id="flagged"> star</label>
        <label class="inline">Delete after
          <input type="number" id="expire" min="1" max="730" placeholder="–" class="days"> days
        </label>
        <label class="switch"><input type="checkbox" id="stop"> no further filters afterwards</label>
      </div>
    </section>

    <section>
      <h2>Where to add it?</h2>
      <div class="row tight">
        <select id="target"></select>
        <input id="new-name" placeholder="Name of the new filter" hidden>
        <select id="section" hidden></select>
        <input id="section-name" placeholder="Name of the new section" hidden>
      </div>
      <div id="plan" class="plan"></div>
      <div id="after" class="after"></div>
    </section>
    </div>

    <section class="rule-code">
      <div id="diff" class="diff"></div>
    </section>

    <footer class="row">
      <label class="inline small inbox-run" title="Messages already in the inbox that the changed rule now catches are moved and marked as well. You see the number before anything happens."><input type="checkbox" id="inbox-run"> Also for matching messages in the inbox</label>
      <span id="inbox-progress" class="muted small"></span>
      <span class="break"></span>
      <button type="button" id="apply">Apply</button>
      <button type="button" id="apply-run" class="ghost" title="Saves the rule and runs it on this message right away">Apply and run on this message</button>
      <button type="button" id="edit" class="ghost">Edit in manager</button>
      <span class="spacer"></span>
      <button type="button" id="cancel" class="ghost">Close</button>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
